server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # L'app est une SPA : toute route inconnue (ex. /accept-invite) doit
    # retomber sur index.html pour que React gère la navigation côté client.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optionnel : si le frontend est configuré avec VITE_API_URL=/api (même
    # domaine), ce proxy relaie vers le conteneur backend nommé "api" dans
    # docker-compose. Si le frontend appelle directement l'URL publique du
    # backend, ce bloc n'est jamais sollicité.
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
